name: TrustArc V2 Verification
on:
  push:
    branches:
      - feature/trustarc-v2-foundation
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/v2/tracking.test.js
      - run: npm run build
